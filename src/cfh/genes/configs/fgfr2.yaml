# Live verified 2026-09-09 (Genome Nexus MSKCC canonical, GRCh37):
# https://www.genomenexus.org/ensembl/canonical-transcript/hgnc/FGFR2?isoformOverrideSource=mskcc
# ENST00000358487; ENSP00000351276; 821 aa.
# PF07714: aa 481-757; https://www.ebi.ac.uk/interpro/api/entry/pfam/PF07714
# PF13895: aa 43-115; https://www.ebi.ac.uk/interpro/api/entry/pfam/PF13895
# D1 participates in FGFR2 autoinhibition:
# https://www.jci.org/articles/view/182417
# Check D1 disruption without asserting it is necessary for FGFR2 fusion activity:
# FGFR2 fusions can retain the extracellular domains. The acid box has no
# separate Pfam annotation here, so it is not configured.
gene_symbol: FGFR2
canonical_transcript_id: NM_000141
protein_id: P21802
entrez_gene_id: 2263
key_domains:
  - name: "Protein kinase domain"
    source: genome_nexus
    key: kinase
    accession: PF07714
disruption_required_domains:
  - name: "Immunoglobulin D1 domain"
    source: genome_nexus
    key: ig_d1
    accession: PF13895
expected_retained_exon_hint: null
analysis_modes:
  - breakpoint_hotspot
  - domain_retention
  - domain_disruption
  - mutation_cooccurrence
mutual_exclusivity_targets:
  # FGFR2 S252W (Ig D2-D3 linker) is the single most recurrent somatic
  # activating FGFR2 point mutation in the literature -- confirmed live via
  # cBioPortal mutation data across every TCGA PanCancer Atlas study
  # (26 occurrences, more than double the next most common FGFR2 change,
  # N549K at 12; see Pollock et al. 2007, Oncogene 26:7158-7162,
  # PMID 17297457, "Frequent activating FGFR2 mutations in endometrial
  # carcinoma"). Both FGFR2 fusions and S252W are gain-of-function kinase
  # activation mechanisms, making this a biologically meaningful comparison
  # -- though live cBioPortal mutation data for the TCGA cohorts run here
  # (cholangiocarcinoma, breast) shows zero S252W carriers, since S252W is
  # itself an endometrial-carcinoma-context hotspot; run and reported as-is
  # rather than substituted for a cohort-matched but non-recurrent mutation.
  - gene: FGFR2
    alteration_type: point_mutation
    entrez_gene_id: 2263
    protein_change: S252W
