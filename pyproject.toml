[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfh"
version = "0.1.0"
description = "Cancer Fusion Hotspots: detect gene-fusion breakpoint/domain-retention hotspots"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Cancer Fusion Hotspots contributors" }]
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "scipy>=1.10",
    "requests>=2.28",
    "pydantic>=2.0",
    "click>=8.5.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "svglib>=1.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.4",
    "pypdf>=4.0",
]

[project.scripts]
cfh = "cfh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cfh.genes" = ["configs/*.yaml"]
"cfh.studies" = ["configs/*.yaml"]

[tool.pytest.ini_options]
markers = [
    "network: tests that make real outbound network calls (excluded by default)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
pretty = true
show_error_codes = true
warn_unused_ignores = true

# These modules contain pre-existing typing debt. Keep the rest of src/ under
# mypy now, then remove entries as the affected modules are tightened up.
[[tool.mypy.overrides]]
module = [
    "cfh.algorithms.confidence_stats",
    "cfh.algorithms.domain_disruption",
    "cfh.algorithms.domain_retention",
    "cfh.algorithms.exon_retention",
    "cfh.algorithms.frequency",
    "cfh.cli",
    "cfh.cohort.outputs",
    "cfh.ingestion.sv_parser",
    "cfh.mapping.feature_mapper",
    "cfh.mapping.genome_nexus_source",
    "cfh.mapping.transcript_source",
    "cfh.real_benchmark",
    "cfh.reporting.fusion_schematic",
    "cfh.stats.breakpoint_tests",
]
ignore_errors = true
